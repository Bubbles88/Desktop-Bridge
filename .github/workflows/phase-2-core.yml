name: phase-2-core

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-selftest:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build Core Service
        run: dotnet build src/ErGe.Core.Service/ErGe.Core.Service.csproj --configuration Release

      - name: Run Phase 1 policy self-test
        run: dotnet run --project src/ErGe.Policy.SelfTest/ErGe.Policy.SelfTest.csproj --configuration Release

      - name: Run Core service self-test
        run: dotnet run --project src/ErGe.Core.Service.SelfTest/ErGe.Core.Service.SelfTest.csproj --configuration Release

      - name: Run one-shot Core probe
        shell: pwsh
        run: |
          $env:ERGE_POLICY_PATH = Join-Path $env:RUNNER_TEMP 'erge-policy.json'
          $env:ERGE_STATUS_PATH = Join-Path $env:RUNNER_TEMP 'erge-runtime-status.json'
          dotnet run --project src/ErGe.Core.Service/ErGe.Core.Service.csproj --configuration Release -- --probe-once
          if (-not (Test-Path $env:ERGE_STATUS_PATH)) { throw 'Runtime status was not created.' }
          Get-Content $env:ERGE_STATUS_PATH
