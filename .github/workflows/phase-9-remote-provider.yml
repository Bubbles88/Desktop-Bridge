name: phase-9-remote-provider

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-e2e:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build Core Service
        run: dotnet build src/ErGe.Core.Service/ErGe.Core.Service.csproj --configuration Release

      - name: Build Session Agent
        run: dotnet build src/ErGe.SessionAgent/ErGe.SessionAgent.csproj --configuration Release

      - name: Build Remote Provider CLI
        run: dotnet build src/ErGe.RemoteProvider.Cli/ErGe.RemoteProvider.Cli.csproj --configuration Release

      - name: Build Local Provider CLI
        run: dotnet build src/ErGe.LocalProvider.Cli/ErGe.LocalProvider.Cli.csproj --configuration Release

      - name: Build Owner Control CLI
        run: dotnet build src/ErGe.OwnerControl.Cli/ErGe.OwnerControl.Cli.csproj --configuration Release

      - name: Install Remote Provider CLI
        shell: pwsh
        run: ./scripts/install-remote-provider-cli.ps1

      - name: Verify Remote Provider CLI
        shell: pwsh
        run: ./scripts/verify-remote-provider-cli.ps1

      - name: Remove CI Remote Provider CLI install
        shell: pwsh
        run: ./scripts/uninstall-remote-provider-cli.ps1

      - name: Run remote origin policy end-to-end path
        shell: pwsh
        run: ./scripts/phase9-remote-provider-e2e.ps1
